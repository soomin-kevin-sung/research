const ns = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text) {
  const element = document.createElementNS(ns,tag);
  Object.entries(attrs).forEach(([key,value]) => element.setAttribute(key,value));
  if (text) element.textContent = text;
  return element;
}
function html(tag,text) {
  const element = document.createElement(tag);
  if (text) element.textContent = text;
  return element;
}
function draw(pattern,index) {
  const { points, links } = layout[index];
  const height = Math.max(...points.map(([,y]) => y))+55;
  const chart = svg("svg",{viewBox:"40 0 560 "+height,role:"img","aria-label":pattern.title});
  const defs = svg("defs",{});
  const marker = svg("marker",{id:"arrow-"+index,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto"});
  marker.append(svg("path",{d:"M0 0 L10 5 L0 10 Z",fill:"#176247"}));
  defs.append(marker);
  chart.append(defs);
  const offset = id => pattern.nodes[id][3] === "decision" ? 34 : 28;
  links.forEach(([from,to,label,labelX,labelY,custom,exception]) => {
    const [x,y] = points[from];
    const [targetX,targetY] = points[to];
    const d = custom || (x === targetX
      ? "M"+x+" "+(y+offset(from))+" V"+(targetY-offset(to))
      : "M"+(x+90)+" "+y+" H"+(targetX-90));
    chart.append(svg("path",{d,class:"edge"+(exception?" exception":""),"marker-end":"url(#arrow-"+index+")"}));
    if (label) chart.append(svg("text",{x:labelX,y:labelY,class:"edge-label"},label));
  });
  pattern.nodes.forEach(([, ,label,type],id) => {
    const [x,y] = points[id];
    const style = "node "+(type || "");
    const geometry = type === "decision"
      ? svg("polygon",{points:[(x-90)+","+y,(x-61)+","+(y-34),(x+61)+","+(y-34),(x+90)+","+y,(x+61)+","+(y+34),(x-61)+","+(y+34)].join(" "),class:style})
      : svg("rect",{x:x-90,y:y-28,width:180,height:56,rx:6,class:style});
    chart.append(geometry);
    const lines = label.split("|");
    lines.forEach((line,i) => chart.append(svg("text",{x,y:y+5+(i-(lines.length-1)/2)*19},line)));
  });
  return chart;
}patterns.forEach((pattern,index) => {

  section.append(html("h2",pattern.title),example,figure,impact);
